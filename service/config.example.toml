# Copy to service.toml (ignored). Run on the host as the OS user with the existing Codex login.
# If needed, run `codex login` manually as that same user; drawing config stays isolated.
# Omit or leave empty to find the native Codex binary on PATH.
binary = ""
# Omit or leave empty to reuse CODEX_HOME, then ~/.codex. Explicit home wins.
home = ""
# One service process owns this state directory, starting at app construction.
state = "/var/lib/maibot-image/state"
# Supply a secret of at least 32 characters through CODEX_IMAGE_SECRET or a UTF-8
# file named by CODEX_IMAGE_SECRET_FILE. CODEX_IMAGE_SECRET takes precedence.
# User authorization belongs to the MaiBot plugin's connection.allowed_users only.
# This service verifies signed identity scopes and isolates jobs by user and chat stream.
model = ""
timeout = 300
rpc_timeout = 30
max_queue = 10
max_image_bytes = 20971520
host = "127.0.0.1"
port = 8765

