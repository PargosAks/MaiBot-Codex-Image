# Copy to service.toml (ignored). home selects an existing Codex login; config is isolated for drawing.
binary = "/home/maibot-image/.local/bin/codex"
home = "~/.codex" # Or a dedicated login directory; use the MaiBot service user's home.
state = "/var/lib/maibot-image/state"
allowed_users = ["qq:YOUR_USER_ID"]
model = ""
timeout = 300
rpc_timeout = 30
max_queue = 10
max_image_bytes = 20971520
host = "127.0.0.1"
port = 8765

