[project]
name = "maibot-codex-image-plugin"
version = "0.14.0"
description = "MaiBot client for an independently deployed Codex image MCP service"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "mcp>=1.28.1,<2", "pillow>=11.3,<13"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "maibot-plugin-sdk @ git+https://github.com/Mai-with-u/maibot-plugin-sdk.git@835e0e9d1f70ea00885fb49d059f7f2864976d05",
    "ruff>=0.12,<1",
    "uvicorn>=0.35,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 公开源码契约用 record_property 保存指纹；xunit1 支持这些审计属性。
junit_family = "xunit1"
addopts = "--strict-markers"
markers = [
    "unit: isolated behavior and SQLite tests without an external source tree or local server",
    "local_integration: loopback MCP transport or local Node integration",
    "external_contract: explicit public Host, SDK, adapter or service source contract",
]

[tool.ruff]
line-length = 110
