[plugin]
config_version = "0.11.0"
enabled = true

[connection]
url = "http://127.0.0.1:8765/mcp" # Docker: use the reachable host gateway address.
secret = "" # Same secret as the host MCP service; at least 32 characters.
allowed_users = [] # Add actual platform:user_id, e.g. qq:123456; empty denies everyone.
poll_seconds = 2
watch_seconds = 360
send_timeout_seconds = 240.0 # Host image-send RPC wait; >0 and <=600, separate from model timeout.

[autonomy]
enabled = false # Opt-in only: enabling can use model/render quotas and share images.
spaces = [] # Configure explicit continuous delegations through the Host panel.
tick_seconds = 5
idle_seconds = 300
timeout_seconds = 30
persona = "热爱观察与绘画的小画师"
plan_task = "utils"
review_task = "vlm" # Must be a Host task with actual image-input support.

[autonomy.global_limits]
think = 0
render = 0
share = 0
max_inflight = 0
max_revisions = 0

# Each spaces entry uses space_id, platform, user_id (delegator), stream_id
# (existing Host session), group_id (empty for private), continuous=false,
# consent_ref, and limits with the same five fields as global_limits.
# group_inspiration=false: opt in per group to MaiBot's planner-authored visual
# thoughts. No transcript/contributor counts or direct model/render/send call.
# Authorized chat/idle planning may adopt them using the existing budgets;
# disabling this flag hides unadopted thoughts but preserves existing plans.
# group_share_mode="collect_only" is the independent default for every group:
# creation/review may continue, but autonomous images stay in the workspace.
# "original_group" permits (never forces) autonomous sharing to the verified group.
# This field does not alter private chats, budgets, or explicit command permissions.
# The Host may continue normal planner rounds after a tool call.
# See docs/implementation-stage-6.md. All budgets default to zero.
# Profiles and series belong to the artist ledger. Existing configuration entries
# are legacy imports; new installations do not need to configure a catalog.
# Image references require reference_inputs=true plus a separate, nonempty
# media_consent_ref in that space. Both default to disabled/empty. Current-message
# images from the delegator only; no history scan. See docs/implementation-i5.md.

