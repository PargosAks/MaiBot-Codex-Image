[plugin]
config_version = "0.5.0"
enabled = true

[connection]
url = "http://127.0.0.1:8765/mcp" # Docker: use the reachable host gateway address.
secret = "" # Same secret as the host MCP service; at least 32 characters.
allowed_users = [] # Add actual platform:user_id, e.g. qq:123456; empty denies everyone.
poll_seconds = 2
watch_seconds = 360

